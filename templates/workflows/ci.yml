name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The weekly release runs this same CI on its release branch.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read
  # For the coverage comment on PRs.
  pull-requests: write

jobs:
  ci:
    uses: inzumer/inzumer-ci/.github/workflows/node-ci.yml@v1
    with:
      ref: ${{ inputs.ref || github.ref }}
      package-manager: pnpm
      audit-level: moderate
      # Needs the json-summary coverage reporter (Vitest: coverage.reporter; Jest: coverageReporters).
      coverage-summary: coverage/coverage-summary.json
      commands: |
        pnpm typecheck
        pnpm lint
        pnpm test:coverage
        pnpm build
