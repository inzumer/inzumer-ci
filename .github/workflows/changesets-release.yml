name: Changesets release

# Reusable Changesets release: "Version Packages" PR, then npm publish. Usage: README.
# @v2 needs the Changesets CLI v3 (changesets/action v2); @v1 stays on CLI v2 (action v1).
on:
  workflow_call:
    inputs:
      check:
        description: Command run before publishing (build, tests…).
        type: string
        default: ''
      version:
        description: Command that applies the changesets.
        type: string
        default: pnpm changeset version
      publish:
        description: Command that publishes the packages.
        type: string
        default: pnpm changeset publish
    secrets:
      NPM_TOKEN:
        description: Only without trusted publishing.
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        # OIDC publishing needs npm 11.5.1 or later (pnpm 9 publishes through npm).
        run: |
          lowest=$(printf '11.5.1 %s' "$(npm --version)" | tr ' ' '\n' | sort -V | head -1)
          [ "$lowest" = 11.5.1 ] || npm install -g npm@11
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Check
        if: inputs.check != ''
        run: ${{ inputs.check }}
      - uses: changesets/action@v2
        with:
          version-script: ${{ inputs.version }}
          publish-script: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
