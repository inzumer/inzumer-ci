name: Changesets release

# Reusable release for npm packages with Changesets: with pending changesets it opens or updates
# the "Version Packages" PR; once that PR is merged it publishes to npm with provenance.
#
# Authentication, one of:
# - Trusted publishing (recommended, no secret): on npmjs.com, package → Settings → Trusted
#   Publisher → GitHub Actions, with the package repository and the CALLING workflow file
#   (e.g. release.yml). npm exchanges the job's OIDC token (`id-token: write`) for a
#   short-lived publish token.
# - An `NPM_TOKEN` secret (granular token with publish rights), passed with `secrets: inherit`.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: inzumer/inzumer-ci/.github/workflows/changesets-release.yml@v1
#       with:
#         check: pnpm check
#       secrets: inherit   # only needed with an NPM_TOKEN
on:
  workflow_call:
    inputs:
      check:
        description: Command run before publishing (build, tests…).
        type: string
        default: ''
      version:
        description: Command that applies the changesets.
        type: string
        default: pnpm changeset version
      publish:
        description: Command that publishes the packages.
        type: string
        default: pnpm changeset publish
    secrets:
      NPM_TOKEN:
        description: Only without trusted publishing.
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        # OIDC publishing needs npm 11.5.1 or later (pnpm 9 publishes through npm).
        run: |
          lowest=$(printf '11.5.1 %s' "$(npm --version)" | tr ' ' '\n' | sort -V | head -1)
          [ "$lowest" = 11.5.1 ] || npm install -g npm@11
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Check
        if: inputs.check != ''
        run: ${{ inputs.check }}
      - uses: changesets/action@v1
        with:
          version: ${{ inputs.version }}
          publish: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
