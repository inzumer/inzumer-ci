name: Changesets release

# Reusable release for npm packages with Changesets: with pending changesets it opens or updates
# the "Version Packages" PR; once that PR is merged it publishes to npm with provenance.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: inzumer/inzumer-ci/.github/workflows/changesets-release.yml@v1
#       with:
#         check: pnpm check
#       secrets: inherit   # NPM_TOKEN
on:
  workflow_call:
    inputs:
      check:
        description: Command run before publishing (build, tests…).
        type: string
        default: ""
      version:
        description: Command that applies the changesets.
        type: string
        default: pnpm changeset version
      publish:
        description: Command that publishes the packages.
        type: string
        default: pnpm changeset publish
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check
        if: inputs.check != ''
        run: ${{ inputs.check }}
      - uses: changesets/action@v1
        with:
          version: ${{ inputs.version }}
          publish: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
