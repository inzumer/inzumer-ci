name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Format
        run: npx -y prettier@3 --check "**/*.{md,yml,mjs,json}"
      - name: Script tests
        run: node --test "scripts/**/__tests__/*.test.mjs"
      - name: Shell scripts
        run: bash -n scripts/release-finish/release-finish.sh
      - name: Workflows and templates match the GitHub Actions schema
        run: |
          for f in .github/workflows/*.yml templates/workflows/*.yml; do
            npx -y @action-validator/cli "$f"
          done

  # Self-test: the reusable accessibility audit must pass on the fixture site.
  a11y:
    uses: ./.github/workflows/a11y.yml
    with:
      package-manager: ''
      static-dir: test/fixtures/a11y-site
      paths: |
        /
        /about

  duplication:
    uses: ./.github/workflows/duplication.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      paths: scripts
      ci-ref: ${{ github.head_ref || github.ref_name }}
