name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Format
        run: npx -y prettier@3 --check "**/*.{md,yml,mjs,json}"
      - name: Script tests
        run: node --test "scripts/*.test.mjs"
      - name: Shell scripts
        run: bash -n scripts/release-finish.sh
      - name: Workflows and templates match the GitHub Actions schema
        run: |
          for f in .github/workflows/*.yml templates/workflows/*.yml; do
            npx -y @action-validator/cli "$f"
          done
